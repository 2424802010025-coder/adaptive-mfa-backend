spring.application.name=adaptive-mfa-backend

# Cấu hình Reverse Proxy (Giúp nhận đúng IP Public thực khi Deploy)
server.forward-headers-strategy=framework

# 1. Cấu hình kết nối MySQL Local
spring.datasource.url=jdbc:mysql://localhost:3306/adaptive_mfa_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root123

# 2. Cấu hình JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# 3. Cấu hình JWT Key (Đồng bộ với JwtTokenProvider)
app.jwt.secret=AdaptiveMFA_Secret_Key_For_Security_Token_Generation_2026_Project
webauthn.relying-party.id=localhost
webauthn.origin=http://localhost:8080
server.port=${PORT:8080}