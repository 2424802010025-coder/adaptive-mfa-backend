spring.application.name=adaptive-mfa-backend

# Cấu hình Reverse Proxy
server.forward-headers-strategy=framework

# Cấu hình JWT Key
app.jwt.secret=AdaptiveMFA_Secret_Key_For_Security_Token_Generation_2026_Project
server.port=${PORT:8080}
webauthn.relying-party.id=adaptive-mfa-backend.onrender.com
webauthn.origin=https://adaptive-mfa-backend.onrender.com

# 1. Cấu hình kết nối Database Neon (Chuyển đổi sang định dạng JDBC)
spring.datasource.url=jdbc:postgresql://ep-red-union-b37u4n6t-pooler.c-4.ap-southeast-1.aws.neon.tech/neondb?sslmode=require&channel_binding=require
spring.datasource.username=neondb_owner
spring.datasource.password=npg_X7SGa0NJVYuz
spring.datasource.driver-class-name=org.postgresql.Driver

# 2. Cấu hình Hibernate để tự động sinh/cập nhật bảng (Auto-DDL)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Tối ưu hóa HikariCP Connection Pool để tiết kiệm RAM (mặc định là 10)
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000

# Tắt in câu lệnh SQL ra log khi chạy trên Cloud để giảm I/O
spring.jpa.show-sql=false