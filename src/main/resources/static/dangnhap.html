<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập - Adaptive MFA & Passkeys Center</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 35px 40px; width: 100%; max-width: 460px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); text-align: center; }

        h2 { margin-bottom: 8px; color: #38bdf8; font-size: 24px; }
        p.subtitle { color: #94a3b8; font-size: 13px; margin-bottom: 24px; }

        .form-group { margin-bottom: 16px; text-align: left; }
        label { display: block; font-size: 13px; color: #cbd5e1; margin-bottom: 6px; }

        .input-password-wrapper { position: relative; }
        input[type="text"], input[type="password"] { width: 100%; padding: 12px 40px 12px 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 14px; outline: none; }
        input:focus { border-color: #38bdf8; }

        .toggle-password { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: transparent; border: none; cursor: pointer; font-size: 16px; color: #94a3b8; }
        .toggle-password:hover { color: #38bdf8; }

        .checkbox-group { display: flex; align-items: center; gap: 8px; margin-top: 10px; margin-bottom: 16px; text-align: left; }
        .checkbox-group input[type="checkbox"] { width: 16px; height: 16px; accent-color: #0284c7; cursor: pointer; }
        .checkbox-group label { margin-bottom: 0; font-size: 13px; color: #cbd5e1; cursor: pointer; user-select: none; }

        button.btn-primary { width: 100%; padding: 12px; border-radius: 8px; border: none; background: #0284c7; color: white; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.2s; margin-top: 10px; }
        button.btn-primary:hover { background: #0369a1; }

        button.btn-passkey { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #38bdf8; background: rgba(56, 189, 248, 0.1); color: #38bdf8; font-size: 14px; font-weight: 600; cursor: pointer; transition: 0.2s; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        button.btn-passkey:hover { background: rgba(56, 189, 248, 0.25); }

        .divider { display: flex; align-items: center; text-align: center; margin: 18px 0; color: #64748b; font-size: 12px; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid #334155; }
        .divider:not(:empty)::before { margin-right: .75em; }
        .divider:not(:empty)::after { margin-left: .75em; }

        .spinner { border: 4px solid rgba(255, 255, 255, 0.1); border-left-color: #38bdf8; border-radius: 50%; width: 36px; height: 36px; animation: spin 1s linear infinite; margin: 15px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .hidden { display: none; }
        .badge { background: #0284c7; color: white; padding: 4px 8px; border-radius: 4px; font-size: 12px; }
        .alert-error { background: #7f1d1d; color: #fca5a5; padding: 10px; border-radius: 6px; font-size: 13px; margin-bottom: 15px; text-align: left; word-break: break-word; }

        .number-matching-box { background: #0f172a; border: 2px dashed #0284c7; border-radius: 12px; padding: 16px; margin: 15px 0; }
        .matching-code { font-size: 42px; font-weight: 800; color: #38bdf8; letter-spacing: 6px; margin-top: 5px; }

        .link-text { margin-top: 18px; font-size: 13px; color: #94a3b8; }
        .link-text a { color: #38bdf8; text-decoration: none; font-weight: 600; }
        .link-text a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="card">

    <!-- 1. FORM ĐĂNG NHẬP CHÍNH -->
    <div id="step-login">
        <h2>Đăng Nhập Hệ Thống</h2>
        <p class="subtitle">Bảo mật Thích ứng Adaptive MFA & Passkeys</p>

        <div id="login-error" class="alert-error hidden"></div>

        <div class="form-group">
            <label>Tên đăng nhập</label>
            <input type="text" id="login-username" placeholder="Nhập tên đăng nhập...">
        </div>

        <div class="form-group">
            <label>Mật khẩu</label>
            <div class="input-password-wrapper">
                <input type="password" id="login-password" placeholder="Nhập mật khẩu...">
                <button type="button" class="toggle-password" onclick="togglePasswordVisibility()">👁️</button>
            </div>
        </div>

        <div class="checkbox-group">
            <input type="checkbox" id="remember-device">
            <label for="remember-device">Ghi nhớ thiết bị này (Thiết bị tin cậy)</label>
        </div>

        <button type="button" class="btn-primary" onclick="handleLogin()">Đăng Nhập Mật Khẩu</button>

        <div class="divider">HOẶC</div>

        <button type="button" class="btn-passkey" onclick="handlePasskeyLogin()">
            🔑 Đăng nhập nhanh bằng Passkey
        </button>

        <div class="link-text">
            Chưa có tài khoản? <a href="dangky.html">Đăng ký ngay</a>
        </div>
    </div>

    <!-- 2. MÀN HÌNH CHỜ XÁC THỰC MFA (NUMBER MATCHING / PASSKEY) -->
    <div id="step-mfa" class="hidden">
        <h2>Xác Thực Thích Ứng (MFA)</h2>
        <p class="subtitle">Phát hiện thiết bị lạ - Cần xác thực bổ sung</p>

        <div id="mfa-error" class="alert-error hidden"></div>

        <div class="number-matching-box">
            <p style="font-size: 13px; color: #cbd5e1;">Mã xác nhận trên thiết bị tin cậy:</p>
            <div id="mfa-code-display" class="matching-code">--</div>
        </div>

        <div class="spinner"></div>

        <p style="font-size: 13px; color: #94a3b8; margin-top: 10px;">
            Điểm rủi ro Trust Score: <span id="trust-score-badge" class="badge">--</span>
        </p>

        <div class="divider">XÁC THỰC THAY THẾ</div>

        <button type="button" class="btn-passkey" onclick="handlePasskeyMfaVerify()">
            🔑 Xác thực bằng Passkey (Windows Hello / TouchID)
        </button>

        <div class="link-text" style="margin-top: 15px;">
            <a href="dangnhap.html">Quay lại đăng nhập</a>
        </div>
    </div>

</div>

<script>
    const API_AUTH = "https://adaptive-mfa-backend.onrender.com/api/auth";
    const API_WEBAUTHN = "https://adaptive-mfa-backend.onrender.com/api/webauthn";
    let pollingInterval = null;
    let currentActiveUsername = "";

    // Hàm ẩn/hiện mật khẩu
    function togglePasswordVisibility() {
        const pwdInput = document.getElementById('login-password');
        pwdInput.type = pwdInput.type === 'password' ? 'text' : 'password';
    }

    // Chuyển đổi Base64URL cho WebAuthn
    function bufferToBase64Url(buffer) {
        const bytes = new Uint8Array(buffer);
        let string = '';
        for (let i = 0; i < bytes.byteLength; i++) {
            string += String.fromCharCode(bytes[i]);
        }
        return btoa(string).replace(/\+/g, "-").replace(/\//g, "_").replace(/=/g, "");
    }

    function base64UrlToBuffer(base64url) {
        let padding = '='.repeat((4 - (base64url.length % 4)) % 4);
        let base64 = (base64url + padding).replace(/-/g, '+').replace(/_/g, '/');
        let rawData = window.atob(base64);
        let outputArray = new Uint8Array(rawData.length);
        for (let i = 0; i < rawData.length; ++i) {
            outputArray[i] = rawData.charCodeAt(i);
        }
        return outputArray.buffer;
    }

    // Luồng Đăng nhập Mật khẩu
    async function handleLogin() {
        const username = document.getElementById('login-username').value.trim();
        const password = document.getElementById('login-password').value;
        const rememberDevice = document.getElementById('remember-device').checked;
        const errorDiv = document.getElementById('login-error');

        errorDiv.classList.add('hidden');
        currentActiveUsername = username;

        if (!username || !password) {
            errorDiv.innerText = "Vui lòng nhập đầy đủ tên đăng nhập và mật khẩu!";
            errorDiv.classList.remove('hidden');
            return;
        }

        try {
            const response = await fetch(`${API_AUTH}/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password, rememberDevice })
            });

            const data = await response.json();
            if (!response.ok) throw new Error(data.message || 'Đăng nhập thất bại');

            // Nếu rủi ro thấp (Trust Score >= 80) -> Đăng nhập thành công ngay
            if (data.trustScore >= 80) {
                processSuccessfulLogin(data.token, username);
            } else {
                // Rủi ro trung bình/thấp -> Chuyển sang màn hình chờ MFA / Number Matching
                document.getElementById('step-login').classList.add('hidden');
                document.getElementById('step-mfa').classList.remove('hidden');
                document.getElementById('trust-score-badge').innerText = data.trustScore;
                document.getElementById('mfa-code-display').innerText = data.mfaCode || '--';

                startPollingMfaStatus(data.requestId);
            }
        } catch (err) {
            errorDiv.innerText = err.message;
            errorDiv.classList.remove('hidden');
        }
    }

    // Đăng nhập nhanh bằng Passkey (Passwordless)
    async function handlePasskeyLogin() {
        const username = document.getElementById('login-username').value.trim();
        const errorDiv = document.getElementById('login-error');
        errorDiv.classList.add('hidden');

        if (!username) {
            errorDiv.innerText = "Vui lòng nhập tên đăng nhập trước khi dùng Passkey!";
            errorDiv.classList.remove('hidden');
            return;
        }

        currentActiveUsername = username;

        try {
            const resOptions = await fetch(`${API_WEBAUTHN}/authenticate/options?username=${encodeURIComponent(username)}`);
            if (!resOptions.ok) throw new Error("Không thể lấy Challenge Passkey!");
            const optionsData = await resOptions.json();

            const assertion = await navigator.credentials.get({
                publicKey: {
                    challenge: base64UrlToBuffer(optionsData.challenge),
                    rpId: optionsData.rpId || window.location.hostname,
                    userVerification: "preferred"
                }
            });

            const credentialId = bufferToBase64Url(assertion.rawId);
            const resVerify = await fetch(`${API_WEBAUTHN}/authenticate/verify?username=${encodeURIComponent(username)}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ credentialId: credentialId })
            });

            const verifyData = await resVerify.json();
            if (!resVerify.ok || verifyData.status !== "SUCCESS") {
                throw new Error(verifyData.message || "Xác thực Passkey thất bại!");
            }

            processSuccessfulLogin(verifyData.accessToken || "MOCK_JWT_PASSKEY_TOKEN", username);
        } catch (err) {
            errorDiv.innerText = "Lỗi Passkey: " + err.message;
            errorDiv.classList.remove('hidden');
        }
    }

    // Xác thực Passkey phụ trong màn hình MFA
    async function handlePasskeyMfaVerify() {
        const errorDiv = document.getElementById('mfa-error');
        errorDiv.classList.add('hidden');

        try {
            const resOptions = await fetch(`${API_WEBAUTHN}/authenticate/options?username=${encodeURIComponent(currentActiveUsername)}`);
            if (!resOptions.ok) throw new Error("Không thể tạo yêu cầu Passkey MFA!");
            const optionsData = await resOptions.json();

            const assertion = await navigator.credentials.get({
                publicKey: {
                    challenge: base64UrlToBuffer(optionsData.challenge),
                    rpId: optionsData.rpId || window.location.hostname,
                    userVerification: "preferred"
                }
            });

            const credentialId = bufferToBase64Url(assertion.rawId);
            const resVerify = await fetch(`${API_WEBAUTHN}/authenticate/verify?username=${encodeURIComponent(currentActiveUsername)}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ credentialId: credentialId })
            });

            const verifyData = await resVerify.json();
            if (!resVerify.ok || verifyData.status !== "SUCCESS") {
                throw new Error("Xác thực Passkey thất bại!");
            }

            if (pollingInterval) clearInterval(pollingInterval);
            processSuccessfulLogin(verifyData.accessToken || "MOCK_JWT_ADAPTIVE_PASSKEY_TOKEN", currentActiveUsername);
        } catch (err) {
            errorDiv.innerText = "Lỗi Passkey: " + err.message;
            errorDiv.classList.remove('hidden');
        }
    }

    // Polling kiểm tra trạng thái phê duyệt MFA từ thiết bị tin cậy
    function startPollingMfaStatus(requestId) {
        if (pollingInterval) clearInterval(pollingInterval);
        pollingInterval = setInterval(async () => {
            try {
                const res = await fetch(`${API_AUTH}/mfa-status/${requestId}`);
                const data = await res.json();

                if (data.status === 'APPROVED') {
                    clearInterval(pollingInterval);
                    processSuccessfulLogin(data.accessToken, currentActiveUsername);
                } else if (data.status === 'REJECTED') {
                    clearInterval(pollingInterval);
                    alert("Yêu cầu xác thực bị TỪ CHỐI hoặc Hết hạn!");
                    window.location.reload();
                }
            } catch (err) {
                console.error("Lỗi Polling MFA:", err);
            }
        }, 2000);
    }

    // Điều hướng thông minh sau khi đăng nhập thành công
    function processSuccessfulLogin(token, username) {
        // Lưu token vào localStorage để các trang khác sử dụng
        localStorage.setItem("jwt_token", token);
        localStorage.setItem("current_username", username);

        // Kiểm tra phân quyền: Nếu là tài khoản Admin -> chuyển sang admin.html, ngược lại sang trangchu.html
        if (username.toLowerCase() === 'admin' || username.toLowerCase().includes('admin')) {
            window.location.href = 'admin.html';
        } else {
            window.location.href = 'trangchu.html';
        }
    }
</script>
</body>
</html>
